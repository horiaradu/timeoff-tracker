<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    A calendar card with an approved day, in the accent from globals.css. The
    header is a tint rather than white so the card keeps its shape on a white
    browser tab.
  -->
  <defs>
    <clipPath id="card">
      <rect x="2" y="2" width="28" height="28" rx="7" />
    </clipPath>
  </defs>
  <rect x="2" y="2" width="28" height="28" rx="7" fill="#4b5bd6" />
  <rect x="2" y="2" width="28" height="8.5" fill="#c6cdfb" clip-path="url(#card)" />
  <path
    d="M10.5 20.5 L14.5 24.5 L22 15.5"
    fill="none"
    stroke="#ffffff"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
